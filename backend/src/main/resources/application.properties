spring.application.name=slotmind
server.port=${PORT:8080}

# Load local, ignored credentials when present; Compose reads the same .env file.
spring.config.import=optional:file:.env[.properties]

# Defaults match docker-compose.yml. Set DB_PASSWORD in .env or the run configuration.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hackathon_db}
spring.datasource.username=${DB_USERNAME:hackathon_user}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Optional OpenAI-compatible chat completion gateway (Groq, Gemini proxy, or local Ollama).
slotmind.ai.enabled=${AI_ENABLED:false}
slotmind.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
slotmind.ai.model=${AI_MODEL:llama-3.3-70b-versatile}
slotmind.ai.api-key=${AI_API_KEY:}
slotmind.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
